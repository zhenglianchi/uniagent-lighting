hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - algorithm.adv_estimator=grpo
    - algorithm.use_kl_in_reward=False
    - data.train_files=/home/ubuntu/swe-rl/data/agentic_train.jsonl
    - data.val_files=/home/ubuntu/swe-rl/data/agentic_val.jsonl
    - data.train_batch_size=1
    - data.val_batch_size=1
    - data.max_prompt_length=4096
    - data.max_response_length=4096
    - data.filter_overlong_prompts=True
    - data.truncation=error
    - actor_rollout_ref.model.path=/home/ubuntu/models/Qwen2.5-Coder-7B-Instruct
    - actor_rollout_ref.model.use_remove_padding=True
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - +actor_rollout_ref.model.override_config.attn_implementation=sdpa
    - actor_rollout_ref.model.lora_rank=32
    - actor_rollout_ref.model.lora_alpha=32
    - actor_rollout_ref.model.use_fused_kernels=False
    - actor_rollout_ref.actor.strategy=fsdp2
    - actor_rollout_ref.actor.fsdp_config.offload_policy=False
    - actor_rollout_ref.actor.fsdp_config.param_offload=False
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=False
    - actor_rollout_ref.actor.fsdp_config.model_dtype=bf16
    - actor_rollout_ref.actor.optim.optimizer=AdamW
    - actor_rollout_ref.actor.optim.optimizer_impl=torch.optim
    - actor_rollout_ref.actor.optim.lr=1e-5
    - actor_rollout_ref.actor.ppo_mini_batch_size=2
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.use_dynamic_bsz=True
    - actor_rollout_ref.actor.ppo_max_token_len_per_gpu=8192
    - actor_rollout_ref.actor.use_kl_loss=False
    - actor_rollout_ref.actor.entropy_coeff=0
    - actor_rollout_ref.rollout.name=vllm
    - actor_rollout_ref.rollout.mode=async
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.5
    - actor_rollout_ref.rollout.n=2
    - actor_rollout_ref.rollout.enforce_eager=True
    - actor_rollout_ref.rollout.free_cache_engine=True
    - actor_rollout_ref.rollout.max_num_seqs=4
    - actor_rollout_ref.rollout.multi_turn.enable=True
    - actor_rollout_ref.rollout.multi_turn.max_parallel_calls=1
    - ++actor_rollout_ref.rollout.multi_turn.format=hermes
    - actor_rollout_ref.rollout.agent.num_workers=1
    - ++actor_rollout_ref.rollout.agent.agent_loop_manager_class=uni_agent.framework.entry.AgentFrameworkRolloutAdapter
    - ++actor_rollout_ref.rollout.custom.agent_framework.gateway_count=1
    - ++actor_rollout_ref.rollout.custom.agent_framework.log_dir=/home/ubuntu/swe-rl/logs/agentic
    - ++actor_rollout_ref.rollout.custom.agent_framework.agent_runners.mini_swe_agent.runner_fqn=uni_agent_ext.agents.mini_swe_agent_runner.mini_swe_agent_runner
    - ++actor_rollout_ref.rollout.custom.agent_framework.agent_runners.mini_swe_agent.dispatch_mode=ray_task
    - ++actor_rollout_ref.rollout.custom.agent_framework.agent_runners.mini_swe_agent.max_concurrent_sessions=2
    - ++actor_rollout_ref.rollout.custom.agent_framework.agent_runners.mini_swe_agent.runner_kwargs.model_name=Qwen2.5-Coder-7B-Instruct
    - ++actor_rollout_ref.rollout.custom.agent_framework.mask_unfinished_episode=False
    - ++actor_rollout_ref.rollout.custom.agent_framework.use_reward_loop_worker=False
    - reward.reward_manager.name=naive
    - trainer.balance_batch=True
    - trainer.logger=["console"]
    - trainer.project_name=swe-rl-agentic
    - trainer.experiment_name=qwen25-7b-grpo-agentic-lora
    - trainer.save_freq=1
    - trainer.resume_mode=auto
    - trainer.default_local_dir=/home/ubuntu/swe-rl/checkpoints/agentic
    - trainer.n_gpus_per_node=1
    - trainer.nnodes=1
    - trainer.total_epochs=1
    - trainer.test_freq=-1
  job:
    name: main_ppo
    chdir: null
    override_dirname: ++actor_rollout_ref.rollout.agent.agent_loop_manager_class=uni_agent.framework.entry.AgentFrameworkRolloutAdapter,++actor_rollout_ref.rollout.custom.agent_framework.agent_runners.mini_swe_agent.dispatch_mode=ray_task,++actor_rollout_ref.rollout.custom.agent_framework.agent_runners.mini_swe_agent.max_concurrent_sessions=2,++actor_rollout_ref.rollout.custom.agent_framework.agent_runners.mini_swe_agent.runner_fqn=uni_agent_ext.agents.mini_swe_agent_runner.mini_swe_agent_runner,++actor_rollout_ref.rollout.custom.agent_framework.agent_runners.mini_swe_agent.runner_kwargs.model_name=Qwen2.5-Coder-7B-Instruct,++actor_rollout_ref.rollout.custom.agent_framework.gateway_count=1,++actor_rollout_ref.rollout.custom.agent_framework.log_dir=/home/ubuntu/swe-rl/logs/agentic,++actor_rollout_ref.rollout.custom.agent_framework.mask_unfinished_episode=False,++actor_rollout_ref.rollout.custom.agent_framework.use_reward_loop_worker=False,++actor_rollout_ref.rollout.multi_turn.format=hermes,+actor_rollout_ref.model.override_config.attn_implementation=sdpa,actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.fsdp_config.model_dtype=bf16,actor_rollout_ref.actor.fsdp_config.offload_policy=False,actor_rollout_ref.actor.fsdp_config.optimizer_offload=False,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.optim.lr=1e-5,actor_rollout_ref.actor.optim.optimizer=AdamW,actor_rollout_ref.actor.optim.optimizer_impl=torch.optim,actor_rollout_ref.actor.ppo_max_token_len_per_gpu=8192,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=2,actor_rollout_ref.actor.strategy=fsdp2,actor_rollout_ref.actor.use_dynamic_bsz=True,actor_rollout_ref.actor.use_kl_loss=False,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.lora_alpha=32,actor_rollout_ref.model.lora_rank=32,actor_rollout_ref.model.path=/home/ubuntu/models/Qwen2.5-Coder-7B-Instruct,actor_rollout_ref.model.use_fused_kernels=False,actor_rollout_ref.model.use_remove_padding=True,actor_rollout_ref.rollout.agent.num_workers=1,actor_rollout_ref.rollout.enforce_eager=True,actor_rollout_ref.rollout.free_cache_engine=True,actor_rollout_ref.rollout.gpu_memory_utilization=0.5,actor_rollout_ref.rollout.max_num_seqs=4,actor_rollout_ref.rollout.mode=async,actor_rollout_ref.rollout.multi_turn.enable=True,actor_rollout_ref.rollout.multi_turn.max_parallel_calls=1,actor_rollout_ref.rollout.n=2,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.tensor_model_parallel_size=1,algorithm.adv_estimator=grpo,algorithm.use_kl_in_reward=False,data.filter_overlong_prompts=True,data.max_prompt_length=4096,data.max_response_length=4096,data.train_batch_size=1,data.train_files=/home/ubuntu/swe-rl/data/agentic_train.jsonl,data.truncation=error,data.val_batch_size=1,data.val_files=/home/ubuntu/swe-rl/data/agentic_val.jsonl,reward.reward_manager.name=naive,trainer.balance_batch=True,trainer.default_local_dir=/home/ubuntu/swe-rl/checkpoints/agentic,trainer.experiment_name=qwen25-7b-grpo-agentic-lora,trainer.logger=["console"],trainer.n_gpus_per_node=1,trainer.nnodes=1,trainer.project_name=swe-rl-agentic,trainer.resume_mode=auto,trainer.save_freq=1,trainer.test_freq=-1,trainer.total_epochs=1
    id: ???
    num: ???
    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.4
    version_base: '1.3'
    cwd: /home/ubuntu/uni-agent/verl
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/ubuntu/uni-agent/verl/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/ubuntu/uni-agent/verl/outputs/2026-08-06/01-23-37
    choices:
      distillation: distillation
      algorithm@algorithm.rollout_correction: rollout_correction
      reward: reward
      model@critic.model: hf_model
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      data: legacy_data
      model_engine: dp
      critic: dp_critic
      critic/../engine@critic.fsdp: fsdp
      critic/../optim@critic.optim: fsdp
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      actor@actor_rollout_ref.actor: dp_actor
      actor/../engine@actor_rollout_ref.actor.fsdp_config: fsdp
      actor/../optim@actor_rollout_ref.actor.optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
